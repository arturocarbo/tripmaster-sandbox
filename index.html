<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TripMaster Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #0084ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 70px; }
    
    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header-title { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; gap: 8px; position: relative; }
    .action-icon-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .dropdown-menu { display: none; position: absolute; right: 0; top: 44px; background: #1e293b; border: 1px solid var(--card-border); border-radius: 12px; width: 200px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
    .dropdown-menu.active { display: block; }
    .dropdown-item { width: 100%; text-align: left; padding: 12px 16px; background: none; border: none; color: var(--text-main); font-size: 0.85rem; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item.danger { color: #ef4444; }

    .search-box { margin-bottom: 16px; }
    .search-input-wrapper { display: flex; align-items: center; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 8px 12px; gap: 8px; }
    .search-input-wrapper input { background: none; border: none; color: #fff; width: 100%; font-size: 0.9rem; outline: none; }

    .trips-list { display: flex; flex-direction: column; gap: 12px; }
    .trip-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--card-border); display: flex; height: 100px; cursor: pointer; }
    .trip-card-img { width: 100px; height: 100%; object-fit: cover; }
    .trip-card-info { padding: 12px; display: flex; flex-direction: column; justify-content: center; flex: 1; }
    .trip-card-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .trip-card-dates { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
    .trip-card-badge { font-size: 0.7rem; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 2px 8px; border-radius: 6px; align-self: flex-start; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.7rem; background: none; border: none; cursor: pointer; gap: 4px; }
    .nav-item.active { color: var(--accent-blue); }
    .nav-item i { font-size: 1.2rem; }

    .fab { position: fixed; bottom: 75px; right: 20px; background: var(--accent-blue); color: white; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 4px 12px rgba(0, 132, 255, 0.4); border: none; cursor: pointer; z-index: 40; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 200; align-items: flex-end; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .action-sheet { background: #1e293b; border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; padding: 20px; max-height: 90vh; overflow-y: auto; border-top: 1px solid var(--card-border); }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .sheet-title { font-weight: 700; font-size: 1.1rem; }
    .sheet-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.85rem; outline: none; }
    .btn-submit { width: 100%; background: var(--accent-blue); border: none; color: white; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 8px; }

    .dark-card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 8px; }
    .day-header { font-size: 0.75rem; font-weight: 800; color: #38bdf8; margin: 16px 0 8px 0; text-transform: uppercase; }
    .timeline-item { display: flex; gap: 12px; margin-bottom: 12px; cursor: pointer; }
    .time-column { width: 50px; font-size: 0.75rem; color: var(--text-muted); text-align: right; }
    .time-zone { display: block; font-size: 0.65rem; color: #64748b; }
    .node-column { display: flex; flex-direction: column; align-items: center; }
    .node-icon { width: 28px; height: 28px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; z-index: 2; }
    .node-icon.flight { background: #0284c7; }
    .node-icon.hotel { background: #059669; }
    .node-icon.car { background: #d97706; }
    .node-icon.food { background: #e11d48; }
    .timeline-line { width: 2px; background: #334155; flex: 1; margin-top: 4px; }
    .content-card { flex: 1; background: var(--card-bg); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--card-border); }
    .card-title-row { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-weight: 700; font-size: 0.85rem; }
    .card-status { font-size: 0.65rem; color: #10b981; }
    .card-subdetail { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .card-meta { font-size: 0.7rem; color: #64748b; margin-top: 4px; border-top: 1px dashed rgba(255,255,255,0.05); padding-top: 4px; }

    .layover-box { background: rgba(255,183,3,0.1); border: 1px dashed #ffb703; color: #ffb703; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; margin: 4px 0 12px 62px; }
    .pill-btn { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .pill-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
  </style>
</head>
<body>

  <!-- SCREEN 1: LISTA DE VIAJES -->
  <div id="screen-trips-list" class="screen active">
    <div class="app-header">
      <div class="header-title"><i class="fa-solid fa-briefcase" style="color:#38bdf8;"></i> Mis Viajes</div>
      <div class="header-actions">
        <button class="action-icon-btn" onclick="toggleDropdown(event, 'dropdown-trips-list')">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <div class="dropdown-menu" id="dropdown-trips-list">
          <button class="dropdown-item" onclick="openModalNewTrip()"><i class="fa-solid fa-plus"></i> Crear Nuevo Viaje</button>
          <button class="dropdown-item" onclick="exportLocalJson()"><i class="fa-solid fa-download"></i> Respaldar JSON</button>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:12px; overflow-x:auto;">
      <button class="pill-btn active" id="pill-trip-all" onclick="setTripTimeFilter('all')">Todos</button>
      <button class="pill-btn" id="pill-trip-upcoming" onclick="setTripTimeFilter('upcoming')">Próximos</button>
      <button class="pill-btn" id="pill-trip-past" onclick="setTripTimeFilter('past')">Pasados</button>
      <select id="trip-year-select" onchange="filterTripsList()" style="background:#1e293b; color:#fff; border:1px solid var(--card-border); border-radius:20px; padding:4px 10px; font-size:0.75rem;">
        <option value="all">📅 Todos los años</option>
      </select>
    </div>

    <div class="search-box">
      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted);"></i>
        <input type="text" id="trip-search-input" placeholder="Buscar viajes..." onkeyup="filterTripsList()">
      </div>
    </div>

    <div class="trips-list" id="trips-container"></div>
  </div>

  <!-- SCREEN 2: DETALLE DEL VIAJE -->
  <div id="screen-trip-detail" class="screen">
    <div class="app-header">
      <button class="action-icon-btn" onclick="showScreen('trips-list')"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="header-actions">
        <button class="action-icon-btn" onclick="shareActiveTrip()"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
        <button class="action-icon-btn" onclick="toggleDropdown(event, 'dropdown-trip-detail')"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        <div class="dropdown-menu" id="dropdown-trip-detail">
          <button class="dropdown-item" onclick="editCurrentTrip()"><i class="fa-solid fa-pen-to-square"></i> Editar Nombre / Fechas</button>
          <button class="dropdown-item" onclick="exportCalendar()"><i class="fa-solid fa-calendar-plus"></i> Sincronizar Calendario</button>
          <button class="dropdown-item danger" onclick="askDeleteCurrentTrip()"><i class="fa-solid fa-trash"></i> Eliminar Viaje</button>
        </div>
      </div>
    </div>

    <div style="background:var(--card-bg); padding:16px; border-radius:16px; border:1px solid var(--card-border); margin-bottom:16px;">
      <div id="detail-title" style="font-size:1.2rem; font-weight:800; color:#fff;">-</div>
      <div id="detail-dates" style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;">-</div>
      <div id="detail-total-cost" style="font-size:0.85rem; color:#10b981; font-weight:700; margin-top:6px;">$0.00 USD</div>
    </div>

    <div id="timeline-container"></div>
  </div>

  <!-- NAVEGACIÓN INFERIOR Y FAB -->
  <button class="fab" onclick="handleFabClick()"><i class="fa-solid fa-plus"></i></button>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchMainTab('trips-list')">
      <i class="fa-solid fa-suitcase"></i> Viajes
    </button>
  </div>

  <!-- MODAL: CREAR / EDITAR VIAJE (CON OPCIÓN DE SUBIR FOTO DEL CELULAR) -->
  <div class="modal-overlay" id="modal-new-trip">
    <div class="action-sheet">
      <div class="sheet-header">
        <div class="sheet-title" id="modal-trip-title">Crear Nuevo Viaje</div>
        <button class="sheet-close" onclick="closeModals()">×</button>
      </div>
      <form onsubmit="saveTripForm(event)">
        <input type="hidden" id="edit-trip-id">
        <div class="form-group">
          <label>Nombre del Viaje</label>
          <input type="text" id="trip-name-input" placeholder="Ej. Vacaciones España" required>
        </div>
        <div class="form-group">
          <label>Destino Principal</label>
          <input type="text" id="trip-dest-input" placeholder="Ej. Madrid, España" required>
        </div>
        <div class="form-group">
          <label>Fecha de Inicio</label>
          <input type="date" id="trip-start-input" required>
        </div>
        <div class="form-group">
          <label>Fecha de Fin</label>
          <input type="date" id="trip-end-input" required>
        </div>
        
        <!-- SECCIÓN DE SELECCIÓN DE IMAGEN (SUBIR O URL) -->
        <div class="form-group">
          <label>Imagen del Viaje / Portada</label>
          <div style="display: flex; gap: 6px; margin-bottom: 6px;">
            <input type="file" id="trip-image-file" accept="image/*" onchange="handleTripImageUpload(event)" style="display:none;">
            <button type="button" onclick="document.getElementById('trip-image-file').click()" style="flex:1; background:#1e293b; color:#38bdf8; border:1px dashed #0084ff; padding:10px; border-radius:8px; font-size:0.8rem; font-weight:600; cursor:pointer;">
              📷 Seleccionar foto del celular
            </button>
          </div>
          <input type="text" id="trip-image-url" placeholder="O pega el enlace de una imagen (https://...)" onchange="updateImagePreview(this.value)">
          <div id="trip-image-preview-box" style="margin-top:8px; display:none; text-align:center;">
            <img id="trip-image-preview" src="" style="width:100%; height:120px; object-fit:cover; border-radius:8px; border:1px solid var(--card-border);">
          </div>
        </div>

        <button type="submit" class="btn-submit">Guardar Viaje</button>
      </form>
    </div>
  </div>

  <!-- MODAL: CONFIRMACIÓN DE ELIMINACIÓN DE VIAJE -->
  <div class="modal-overlay" id="modal-confirm-delete">
    <div class="action-sheet" style="text-align: center;">
      <div style="font-size: 2.5rem; color: #ef4444; margin-bottom: 8px;">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="sheet-title" style="font-size: 1.1rem; margin-bottom: 6px;">¿Eliminar este viaje?</div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;" id="delete-trip-msg">
        Se borrarán de forma permanente todos los vuelos y actividades asociadas.
      </p>
      <div style="display:flex; gap:10px;">
        <button class="btn-submit" style="background:#ef4444;" onclick="confirmDeleteTrip()">Sí, eliminar viaje</button>
        <button class="btn-submit" style="background:#334155;" onclick="closeModals()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
